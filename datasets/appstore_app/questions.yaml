# One 12-way choice question. The answer is the app the review was posted to; app names are masked in the text.
app:
  type: choice
  instructions: Which app is this App Store review about?
  criteria:
    facebook: Facebook
    instagram: Instagram
    tiktok: TikTok
    uber: Uber rides and Uber Eats
    spotify: Spotify music and podcasts
    netflix: Netflix streaming
    duolingo: Duolingo language learning
    amazon_shopping: Amazon Shopping
    whatsapp: WhatsApp messaging
    gmail: Gmail email
    youtube: YouTube video
    snapchat: Snapchat
