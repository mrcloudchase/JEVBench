[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdm"
version = "0.1.0"
description = "Evaluate typed decision models' beliefs across models and tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
local = ["torch", "transformers", "huggingface_hub", "von-sdk", "opendecider[serve]"]   # the three local model servers

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
