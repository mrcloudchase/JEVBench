[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevbench"
version = "0.1.0"
description = "CLI-first, file-driven workbench for composing and running judging frameworks on JEV-compatible decision models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typesafe-sdk>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevbench = "jevbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
