# Composition: judges from this file feed a reusable policy subgraph loaded from another file.
jevbench: 1
name: composed
version: 1.0.0
description: Three judges plus the shared majority_vote policy subgraph.

inputs:
  text: {required: true}

defaults:
  model: jev-latest

nodes:
  a:
    type: judge
    state: ${input.text}
    questions: &q
      label:
        type: choice
        instructions: Overall sentiment
        criteria: {positive: null, neutral: null, negative: null}
  b:
    type: judge
    state: {text: "${input.text}", note: "Judge the sentiment literally."}
    questions: *q
  c:
    type: judge
    model: jev-preview
    state: ${input.text}
    questions: *q

  policy:
    type: subgraph
    framework: policies/majority_vote.yaml   # relative to this file; or `majority_vote@1.0.0` from the store
    inputs:
      labels: "[nodes.a.answers.label.choice, nodes.b.answers.label.choice, nodes.c.answers.label.choice]"
      weights: "[nodes.a.answers.label.confidence, nodes.b.answers.label.confidence, nodes.c.answers.label.confidence]"
      min_share: "0.5"

output: ${nodes.policy}

tests:
  - name: confidence-weighted majority
    input: {text: "meh, it works I guess"}
    mock:
      a: {label: {neutral: 0.9, positive: 0.1, negative: 0.0}}
      b: {label: {negative: 0.5, neutral: 0.3, positive: 0.2}}
      c: {label: {neutral: 0.8, positive: 0.2, negative: 0.0}}
    expect: ["judgment.decision == 'neutral'", "judgment.share > 0.5"]
