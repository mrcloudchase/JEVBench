# Image judging with the `box` primitive (needs a provider with the images capability and a
# jev-1.14 model). Assets are referenced by id from state/instructions; files load relative to this file.
jevbench: 1
name: image_box
version: 1.0.0
description: Locate shapes in an image and check the result with a policy.

inputs:
  image_path: {required: false, default: inputs/shapes.png}

nodes:
  locate:
    type: judge
    model: jev-preview
    state: {photo: "img-1"}
    assets:
      img-1: {path: "${input.image_path}"}
    questions:
      red: {type: box, instructions: "the red rectangle in `photo`"}
      largest:
        type: choice
        instructions: Which coloured shape is largest in `photo`?
        criteria: {red: null, blue: null, green: null}
      has_circle: {type: noul, instructions: "`photo` contains a circle"}

  plausible:
    type: constraint
    rules:
      - name: box_well_formed
        require: nodes.locate.answers.red.box.left < nodes.locate.answers.red.box.right and nodes.locate.answers.red.box.top < nodes.locate.answers.red.box.bottom
      - name: box_confident
        require: nodes.locate.answers.red.confidence >= 0.5

output:
  red_box: ${nodes.locate.answers.red.box}
  largest: ${nodes.locate.answers.largest.choice}
  plausible: ${nodes.plausible.satisfied}

tests:
  - name: mocked box
    mock:
      locate: {red: {top: 0.2, bottom: 0.67, left: 0.25, right: 0.62}, largest: red, has_circle: 0.0}
    expect: ["judgment.plausible", "judgment.largest == 'red'"]
