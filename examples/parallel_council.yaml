# Parallel council: three independent judges on the same evidence, combined by vote and
# weighted aggregation, with abstention when the council does not agree strongly enough.
jevbench: 1
name: parallel_council
version: 1.0.0
description: Three moderators vote on a chat message; a policy layer decides or abstains.

inputs:
  message: {required: true}
  channel_rules: {required: false, default: "No harassment, no spam, no personal data."}

defaults:
  model: jev-latest

# Every judge gets identical questions but different framing. They run in parallel (same level).
nodes:
  strict:
    type: judge
    state: {message: "${input.message}", rules: "${input.channel_rules}", stance: "Apply the rules strictly."}
    questions: &questions
      verdict:
        type: choice
        instructions: What should happen to `message` under `rules`?
        criteria: {allow: Clearly fine, review: Borderline or unclear, remove: Clearly violates the rules}
      severity:
        type: score
        instructions: How harmful is `message`?
        criteria: [Harmless, Mildly inappropriate, Clearly harmful, Dangerous]
  lenient:
    type: judge
    state: {message: "${input.message}", rules: "${input.channel_rules}", stance: "Give the benefit of the doubt."}
    questions: *questions
  literal:
    type: judge
    model: jev-preview
    state: {message: "${input.message}", rules: "${input.channel_rules}"}
    questions: *questions

  # Policy: weighted plurality vote over the three verdicts. The strict judge counts 1.5x.
  verdict_vote:
    type: vote
    values:
      - nodes.strict.answers.verdict.choice
      - nodes.lenient.answers.verdict.choice
      - nodes.literal.answers.verdict.choice
    weights: [1.5, 1.0, 1.0]
    method: majority

  # Policy: mean severity across judges, and the lowest confidence any judge had.
  severity:
    type: aggregate
    method: mean
    values: [nodes.strict.answers.severity.score, nodes.lenient.answers.severity.score, nodes.literal.answers.severity.score]
  min_confidence:
    type: aggregate
    method: min
    values: [nodes.strict.answers.verdict.confidence, nodes.lenient.answers.verdict.confidence, nodes.literal.answers.verdict.confidence]

  # Hard constraint: nobody may auto-remove when any judge is unsure.
  guard:
    type: constraint
    rules:
      - name: confident_enough
        require: nodes.min_confidence >= 0.4
      - name: not_dangerous_without_consensus
        require: not (nodes.severity >= 2.5 and not nodes.verdict_vote.unanimous)

  decision:
    type: decide
    cases:
      - when: nodes.verdict_vote.winner is None
        then: abstain
      - when: not nodes.guard.satisfied
        then: human_review
      - when: nodes.verdict_vote.winner == 'remove' and nodes.severity >= 1.5
        then: remove
      - when: nodes.verdict_vote.winner == 'allow'
        then: allow
    default: human_review

output:
  decision: ${nodes.decision}
  vote: ${nodes.verdict_vote}
  severity: ${nodes.severity}
  min_confidence: ${nodes.min_confidence}
  violations: ${nodes.guard.violations}

tests:
  - name: unanimous allow
    input: {message: "good game everyone, see you tomorrow"}
    mock:
      strict: {verdict: allow, severity: 0}
      lenient: {verdict: allow, severity: 0}
      literal: {verdict: allow, severity: 0}
    expect:
      - judgment.decision == 'allow'
      - judgment.vote.unanimous
  - name: split council abstains
    input: {message: "you people are the worst"}
    mock:
      strict: {verdict: remove, severity: 2}
      lenient: {verdict: allow, severity: 1}
      literal: {verdict: review, severity: 1}
    expect:
      - judgment.decision == 'abstain'
      - judgment.vote.winner is None
  - name: low confidence forces human review
    input: {message: "..."}
    mock:
      strict: {verdict: {remove: 0.5, review: 0.3, allow: 0.2}, severity: 2}
      lenient: {verdict: remove, severity: 2}
      literal: {verdict: remove, severity: 2}
    expect:
      - judgment.decision == 'human_review'
      - "'confident_enough' in judgment.violations"
