# Bounded iteration: keep re-judging with a growing hint until the judge is confident,
# for at most `max_iterations` rounds. `loop.iteration`, `loop.previous` and `loop.history`
# are available inside the body; `until` is evaluated against the body's nodes after each round.
jevbench: 1
name: iterative_review
version: 1.0.0
description: Re-ask with more context until confident or out of budget.

inputs:
  document: {required: true}
  question: {required: true}
  options: {required: true, description: "map option -> description"}

nodes:
  refine:
    type: loop
    max_iterations: 3
    until: nodes.judge.answers.answer.confidence >= 0.8
    inputs: {document: input.document, question: input.question, options: input.options}
    body:
      nodes:
        judge:
          type: judge
          model: jev-latest
          state:
            document: ${input.document}
            round: ${loop.iteration}
            previous_rounds: ${loop.history}
            note: "${'Earlier rounds were uncertain; focus on the strongest textual evidence.' if loop.iteration > 1 else ''}"
          questions:
            answer:
              type: choice
              instructions: ${input.question}
              criteria: ${input.options}
      output:
        choice: ${nodes.judge.answers.answer.choice}
        confidence: ${nodes.judge.answers.answer.confidence}

  verdict:
    type: decide
    cases:
      - when: nodes.refine.converged
        then: ${nodes.refine.value.choice}
    default: undetermined

output:
  verdict: ${nodes.verdict}
  rounds: ${nodes.refine.iterations}
  converged: ${nodes.refine.converged}
  history: ${nodes.refine.history}

tests:
  - name: converges on round two
    input: {document: "The invoice is due on March 3.", question: "When is the invoice due?", options: {march_3: null, april_3: null, not_stated: null}}
    mock:
      refine.judge:
        - {answer: {march_3: 0.5, april_3: 0.3, not_stated: 0.2}}
        - {answer: march_3}
    expect: ["judgment.verdict == 'march_3'", "judgment.rounds == 2", "judgment.converged"]
  - name: never converges, bounded at three
    input: {document: "...", question: "?", options: {a: null, b: null}}
    mock:
      refine.judge: {answer: {a: 0.55, b: 0.45}}
    expect: ["judgment.verdict == 'undetermined'", "judgment.rounds == 3", "not judgment.converged"]
