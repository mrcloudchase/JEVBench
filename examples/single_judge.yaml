# The smallest valid framework: one JudgeJEV node -> one Issue -> one API call -> one Ruling.
jevbench: 1
name: single_judge
version: 1.0.0
description: Triage one support ticket with three questions in a single call.

inputs:
  ticket: {description: "Ticket text or object", required: true}

nodes:
  triage:
    type: judge
    model: jev-latest
    state: ${input.ticket}
    questions:
      department:
        type: choice
        instructions: Which team should handle this ticket?
        criteria:
          billing: Charges, invoices, refunds, payment problems
          technical: Bugs, errors, integration problems
          sales: Pricing, plans, upgrades
          other: null
      frustration:
        type: score
        instructions: How frustrated does the customer appear?
        criteria: [Calm, Frustrated but civil, Very angry or threatening]
      refund_requested:
        type: noul
        instructions: Is the customer explicitly asking for a refund?

# With a single node, output defaults to that node's ruling. Shape it explicitly if you prefer:
output:
  department: ${nodes.triage.answers.department.choice}
  confidence: ${nodes.triage.answers.department.confidence}
  frustration: ${nodes.triage.answers.frustration.score}
  refund_requested: ${nodes.triage.answers.refund_requested.noul > 0.5}

tests:
  - name: angry refund goes to billing
    input: {ticket: "Charged twice for order A-104. Refund the duplicate NOW or I dispute it."}
    mock:
      triage: {department: billing, frustration: 2, refund_requested: 0.97}
    expect:
      - judgment.department == 'billing'
      - judgment.frustration >= 1.5
      - judgment.refund_requested
  - name: live smoke (needs --live)
    input: {ticket: "Charged twice for order A-104. Refund the duplicate NOW or I dispute it."}
    expect:
      - judgment.department == 'billing'
      - judgment.refund_requested
