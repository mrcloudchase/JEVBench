# Adversarial evaluation: a prosecutor and a defender judge the same claim from opposite
# stances; an arbiter sees both and the consensus policy checks whether they converge anyway.
jevbench: 1
name: adversarial
version: 1.0.0
description: Prosecutor vs. defender, settled by an arbiter.

inputs:
  claim: {required: true}
  evidence: {required: true}

defaults:
  model: jev-latest

nodes:
  prosecutor:
    type: judge
    state: {claim: "${input.claim}", evidence: "${input.evidence}", stance: "Find every reason the claim is false or unsupported."}
    questions: &q
      supported:
        type: noul
        instructions: Is `claim` supported by `evidence`?
      strength:
        type: score
        instructions: Strength of the evidence for `claim`
        criteria: [None, Weak, Moderate, Strong, Conclusive]
  defender:
    type: judge
    state: {claim: "${input.claim}", evidence: "${input.evidence}", stance: "Find every reason the claim is true and supported."}
    questions: *q

  arbiter:
    type: judge
    state:
      claim: ${input.claim}
      evidence: ${input.evidence}
      prosecutor_says: ${nodes.prosecutor.answers}
      defender_says: ${nodes.defender.answers}
    questions:
      supported:
        type: noul
        instructions: Weighing both sides, is `claim` supported by `evidence`?

  sides_agree:
    type: consensus
    values: [nodes.prosecutor.answers.supported.noul > 0.5, nodes.defender.answers.supported.noul > 0.5]

  verdict:
    type: decide
    cases:
      - when: nodes.sides_agree.agreed and nodes.sides_agree.value
        then: supported
      - when: nodes.sides_agree.agreed and not nodes.sides_agree.value
        then: unsupported
      - when: nodes.arbiter.answers.supported.noul >= 0.7
        then: supported
      - when: nodes.arbiter.answers.supported.noul <= 0.3
        then: unsupported
    default: undetermined

output:
  verdict: ${nodes.verdict}
  contested: ${not nodes.sides_agree.agreed}
  arbiter_probability: ${nodes.arbiter.answers.supported.noul}

tests:
  - name: both sides agree, arbiter irrelevant
    input: {claim: "Water boils at 100C at sea level", evidence: "Standard physics reference."}
    mock:
      prosecutor: {supported: 0.8, strength: 4}
      defender: {supported: 0.95, strength: 4}
      arbiter: {supported: 0.1}
    expect: ["judgment.verdict == 'supported'", "not judgment.contested"]
  - name: contested, arbiter decides
    input: {claim: "X", evidence: "Y"}
    mock:
      prosecutor: {supported: 0.2, strength: 1}
      defender: {supported: 0.9, strength: 3}
      arbiter: {supported: 0.75}
    expect: ["judgment.verdict == 'supported'", "judgment.contested"]
  - name: contested, arbiter unsure
    input: {claim: "X", evidence: "Y"}
    mock:
      prosecutor: {supported: 0.2, strength: 1}
      defender: {supported: 0.9, strength: 3}
      arbiter: {supported: 0.5}
    expect: ["judgment.verdict == 'undetermined'"]
