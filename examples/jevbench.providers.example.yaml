# Copy to ./jevbench.providers.yaml (git-ignored) or ~/.config/jevbench/providers.yaml.
# Credentials come from the environment via ${env:NAME}; never put keys in framework files.
default: typesafe

providers:
  # The built-in provider is always present; override it here only to change defaults.
  typesafe:
    base_url: https://api.typesafe.ai
    api_key: ${env:TYPESAFE_API_KEY}
    default_model: jev-latest
    client: sdk                   # official typesafe-sdk
    capabilities: [images, box, long_context]

  # A pinned model under a separate name so a judge can select it by provider alone.
  typesafe_114:
    api_key: ${env:TYPESAFE_API_KEY}
    default_model: jev-1.14.0

  # Any JEV-wire-compatible gateway mounting the same body on a different path uses the raw
  # HTTP client. Headers are sent on every request.
  gateway:
    base_url: https://ai-gateway.example.com
    path: /v1/evaluate
    api_key: ${env:GATEWAY_API_KEY}
    default_model: typesafe-ai/jev
    client: http
    headers: {X-Team: judging}
    capabilities: []              # no images through this gateway

  # Deterministic offline provider for development; pin answers per question id if you like.
  mock:
    client: mock
    default_model: mock
    mock_answers: {department: billing}
