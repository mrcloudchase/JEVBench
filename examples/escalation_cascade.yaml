# Conditional routing / escalation: a cheap first-pass judge handles the easy cases; a second,
# differently-framed judge only runs when the first is unsure (its node has a `when`).
jevbench: 1
name: escalation_cascade
version: 1.0.0
description: Escalate to a second judge only when the first is not confident.

inputs:
  message: {required: true}
  confidence_floor: {required: false, default: 0.6}

nodes:
  first_pass:
    type: judge
    model: jev-latest
    state: ${input.message}
    questions:
      intent:
        type: choice
        instructions: Primary intent of the message
        criteria:
          order_status: Asking about an existing order
          product_question: Asking about a product
          return_exchange: Wants to return or exchange
          complaint: Unhappy, wants resolution
          other: null

  confident:
    type: threshold
    value: nodes.first_pass.answers.intent.confidence
    min: ${input.confidence_floor}

  # Only runs when the first pass was not confident. Skipped nodes evaluate to null downstream.
  escalated:
    type: judge
    when: not nodes.confident
    model: jev-preview
    state:
      message: ${input.message}
      hint: "The first pass was unsure between: ${[k for k, v in nodes.first_pass.answers.intent.probabilities.items() if v > 0.15]}"
    questions:
      intent:
        type: choice
        instructions: Primary intent of `message`, considering `hint`
        criteria:
          order_status: Asking about an existing order
          product_question: Asking about a product
          return_exchange: Wants to return or exchange
          complaint: Unhappy, wants resolution
          other: null

  route:
    type: decide
    cases:
      - when: nodes.confident
        then: ${nodes.first_pass.answers.intent.choice}
      - when: nodes.escalated.answers.intent.confidence >= 0.5
        then: ${nodes.escalated.answers.intent.choice}
    default: human

output:
  route: ${nodes.route}
  escalated: ${nodes.escalated is not None}
  first_pass_confidence: ${nodes.first_pass.answers.intent.confidence}

tests:
  - name: confident first pass, no escalation
    input: {message: "Where is my order #123?"}
    mock:
      first_pass: {intent: order_status}
    expect: ["judgment.route == 'order_status'", "not judgment.escalated"]
  - name: unsure first pass escalates
    input: {message: "this thing arrived broken, what now"}
    mock:
      first_pass: {intent: {complaint: 0.45, return_exchange: 0.4, other: 0.15}}
      escalated: {intent: return_exchange}
    expect: ["judgment.route == 'return_exchange'", "judgment.escalated"]
  - name: both unsure goes to a human
    input: {message: "hm"}
    mock:
      first_pass: {intent: {complaint: 0.3, return_exchange: 0.3, other: 0.4}}
      escalated: {intent: {complaint: 0.34, return_exchange: 0.33, other: 0.33}}
    expect: ["judgment.route == 'human'"]
