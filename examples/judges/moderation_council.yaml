# Judge library: three moderators with different framings, and nothing else.
# No policy here. The output is the raw material a policy layer consumes:
# parallel lists of verdict labels, severity scores and confidences.
jevbench: 1
name: moderation_council
version: 1.0.0
description: Three framed moderators judge one message; outputs their rulings as lists.

inputs:
  message: {required: true}
  rules: {required: false, default: "Be respectful. No harassment, slurs or spam."}

defaults:
  model: jev-latest

nodes:
  strict:
    type: judge
    state: {message: "${input.message}", rules: "${input.rules}", stance: "Apply the rules strictly."}
    questions: &questions
      verdict:
        type: choice
        instructions: What should happen to `message` under `rules`?
        criteria: {allow: Clearly fine, review: Borderline or unclear, remove: Clearly violates the rules}
      severity:
        type: score
        instructions: How harmful is `message`?
        criteria: [Harmless, Mildly inappropriate, Clearly harmful, Dangerous]
  lenient:
    type: judge
    state: {message: "${input.message}", rules: "${input.rules}", stance: "Give the benefit of the doubt."}
    questions: *questions
  literal:
    type: judge
    model: jev-preview
    state: {message: "${input.message}", rules: "${input.rules}"}
    questions: *questions

output:
  verdicts: ${[nodes.strict.answers.verdict.choice, nodes.lenient.answers.verdict.choice, nodes.literal.answers.verdict.choice]}
  confidences: ${[nodes.strict.answers.verdict.confidence, nodes.lenient.answers.verdict.confidence, nodes.literal.answers.verdict.confidence]}
  severities: ${[nodes.strict.answers.severity.score, nodes.lenient.answers.severity.score, nodes.literal.answers.severity.score]}
  rulings: {strict: "${nodes.strict.answers}", lenient: "${nodes.lenient.answers}", literal: "${nodes.literal.answers}"}

tests:
  - name: outputs are parallel lists
    input: {message: "x"}
    mock:
      strict: {verdict: remove, severity: 2}
      lenient: {verdict: review, severity: 1}
      literal: {verdict: remove, severity: 2}
    expect:
      - judgment.verdicts == ['remove', 'review', 'remove']
      - len(judgment.confidences) == 3 and len(judgment.severities) == 3
      - judgment.rulings.strict.verdict.choice == 'remove'
