# Re-ask with the previous belief in hand until confidence clears the floor, at most three rounds.
jevbench: 1
name: iterative
version: 1.0.0
inputs: {text: {required: true}, instructions: {required: true}, criteria: {required: true}, tau: {default: 0.5}}
nodes:
  rounds:
    type: loop
    max_iterations: 3
    until: nodes.d.answers.q.confidence >= input.tau
    inputs: {text: input.text, instructions: input.instructions, criteria: input.criteria, tau: input.tau}
    body:
      nodes:
        d:
          type: judge
          model: jev-1.13.0
          state:
            text: ${input.text}
            round: ${loop.iteration}
            previous: ${loop.previous}
            note: "${'Earlier rounds were uncertain between the options shown in `previous`; decide on the strongest evidence in `text`.' if loop.previous else ''}"
          questions:
            q: {type: choice, instructions: "${input.instructions}", criteria: "${input.criteria}"}
      output: ${nodes.d.answers.q}
output:
  answer: ${nodes.rounds.value.choice if nodes.rounds.converged else 'abstain'}
  confidence: ${nodes.rounds.value.confidence}
  probabilities: ${nodes.rounds.value.probabilities}
  rounds: ${nodes.rounds.iterations}
