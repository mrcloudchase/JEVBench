# Decompose then decide: a first decision answers three auxiliary yes/no questions; a second decision
# sees those beliefs as evidence alongside the text and answers the main question.
jevbench: 1
name: chain
version: 1.0.0
inputs: {text: {required: true}, instructions: {required: true}, criteria: {required: true}, aux: {required: true}}
nodes:
  findings:
    type: judge
    model: jev-1.13.0
    state: ${input.text}
    questions:
      f0: {type: noul, instructions: "${input.aux[0]}"}
      f1: {type: noul, instructions: "${input.aux[1]}"}
      f2: {type: noul, instructions: "${input.aux[2]}"}
  chair:
    type: judge
    model: jev-1.13.0
    state:
      text: ${input.text}
      findings:
        - {question: "${input.aux[0]}", probability: "${nodes.findings.answers.f0.noul}"}
        - {question: "${input.aux[1]}", probability: "${nodes.findings.answers.f1.noul}"}
        - {question: "${input.aux[2]}", probability: "${nodes.findings.answers.f2.noul}"}
    questions:
      q: {type: choice, instructions: "${input.instructions} Consider `findings` as prior evidence about `text`.", criteria: "${input.criteria}"}
output:
  answer: ${nodes.chair.answers.q.choice}
  confidence: ${nodes.chair.answers.q.confidence}
  probabilities: ${nodes.chair.answers.q.probabilities}
  findings: ${[nodes.findings.answers.f0.noul, nodes.findings.answers.f1.noul, nodes.findings.answers.f2.noul]}
