# One decision plus an abstention rule: act only when confidence clears the floor (Chow's reject option).
jevbench: 1
name: gated
version: 1.0.0
inputs: {text: {required: true}, instructions: {required: true}, criteria: {required: true}, tau: {default: 0.5}}
nodes:
  d:
    type: judge
    model: jev-1.13.0
    state: ${input.text}
    questions:
      q: {type: choice, instructions: "${input.instructions}", criteria: "${input.criteria}"}
  act: {type: expr, value: nodes.d.answers.q.confidence >= input.tau}
output:
  answer: ${nodes.d.answers.q.choice if nodes.act else 'abstain'}
  confidence: ${nodes.d.answers.q.confidence}
  probabilities: ${nodes.d.answers.q.probabilities}
