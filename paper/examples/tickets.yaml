# A small dataset: TypeSafe's quickstart questions, shared across several states.
# Any keys besides `state` and `questions` (here `id` and `label`) pass through to the output.
questions:
  department:
    type: choice
    instructions: Which team should handle this
    criteria:
      billing: Payment or subscription issues
      technical: Bugs or integration problems
      sales: Pricing or account questions
  frustration:
    type: score
    instructions: How frustrated the customer appears
    criteria:
      - Calm, just stating facts
      - Frustrated but civil
      - Very angry, strong language
  is_urgent:
    type: noul
    instructions: The message conveys urgency or time-sensitivity

cases:
  - id: t1
    label: technical
    state: >-
      Our API integration started returning 500 errors on every request about 20 minutes ago,
      and we can't process any customer orders until this is fixed.
  - id: t2
    label: billing
    state: I was charged twice for my subscription this month. Please refund the duplicate.
  - id: t3
    label: sales
    state: Could you send me pricing for the enterprise plan when you get a chance?
  - id: t4
    label: billing
    state: This is the THIRD time I'm asking. Cancel my plan and stop charging my card, NOW.
  - id: t5
    label: technical
    state: The webhook docs say retries happen every 5 minutes but we're seeing them every 30 seconds.
